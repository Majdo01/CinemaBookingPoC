spring.application.name=cinema-application

server.port=8080

# --- Database connection ---------------------------------------------------
# DB_URL, DB_USERNAME and DB_PASSWORD override the defaults below.
#
# The password default "postgres" is a LOCAL DEVELOPMENT convenience only: it
# lets a fresh clone start against a default local PostgreSQL install without
# exporting DB_PASSWORD first. Every shared, deployed or CI environment must
# set DB_PASSWORD explicitly; the default is never meant for those.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cinema_booking}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}

# --- Schema ownership ------------------------------------------------------
# Flyway (src/main/resources/db/migration) owns the schema. Hibernate no
# longer creates or updates tables; it only validates that the entity mapping
# matches the migrated schema and fails at startup if they diverge.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Flyway and Hibernate are pinned to the same schema ("public"), so the
# migrations build exactly the tables Hibernate validates against.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.jpa.properties.hibernate.default_schema=public
